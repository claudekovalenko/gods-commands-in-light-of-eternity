<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="A visual summary of what God commands and emphasizes throughout the 66 books of Scripture, in light of eternity.">
<title>God's Commands in Light of Eternity</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="header">
  <h1 id="title">God&rsquo;s Commands in Light of Eternity</h1>
  <p class="subtitle" id="subtitle">What the Word of God emphasizes &mdash; to believe, to pursue, to avoid &mdash; summarized from the 66 books</p>
</header>

<div id="controls">
  <label class="ctl">
    <span id="lang-label">Language</span>
    <select id="lang"></select>
  </label>
  <label class="ctl">
    <span id="trans-label">Translation</span>
    <select id="translation"></select>
  </label>
</div>

<div id="legend">
  <div class="legend-item"><span class="dot center-dot"></span> <span data-legend="center"></span></div>
  <div class="legend-item"><span class="dot pursue-dot"></span> <span data-legend="pursue"></span></div>
  <div class="legend-item"><span class="dot avoid-dot"></span> <span data-legend="avoid"></span></div>
  <div class="legend-item"><span class="line-sample"></span> <span data-legend="emphasis"></span></div>
</div>

<svg id="graph" role="img" aria-label="Interactive graph of biblical themes. Tap a node to read its verses."></svg>

<div id="hint"></div>

<aside id="panel" aria-live="polite">
  <button id="panel-close" aria-label="Close" title="Close">&times;</button>
  <div id="panel-content"></div>
</aside>

<footer id="footer">
  <p id="footer-text"></p>
</footer>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
