<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="A visual summary of what God commands and emphasizes throughout the 66 books of Scripture, in light of eternity.">
<title>God's Commands in Light of Eternity</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="header">
  <h1 id="title">God&rsquo;s Commands in Light of Eternity</h1>
  <p class="subtitle" id="subtitle">What the Word of God emphasizes &mdash; to believe, to pursue, to avoid &mdash; summarized from the 66 books</p>
</header>

<div id="topbar">
  <div class="bar-row">
    <div class="ctl">
      <span class="cap">Language &middot; &#1575;&#1604;&#1604;&#1594;&#1577;</span>
      <div class="seg" id="lang-seg" role="group" aria-label="Language / اللغة"></div>
    </div>
    <div class="ctl ctl-end">
      <span class="cap">Bible &middot; &#1575;&#1604;&#1578;&#1585;&#1580;&#1605;&#1577;</span>
      <select id="translation" aria-label="Bible translation / ترجمة الكتاب المقدس"></select>
    </div>
  </div>
</div>

<div id="legend">
  <div class="legend-item"><span class="dot center-dot"></span> <span data-legend="center"></span></div>
  <div class="legend-item"><span class="dot pursue-dot"></span> <span data-legend="pursue"></span></div>
  <div class="legend-item"><span class="dot avoid-dot"></span> <span data-legend="avoid"></span></div>
  <div class="legend-item"><span class="line-sample"></span> <span data-legend="emphasis"></span></div>
</div>

<svg id="graph" role="img" aria-label="Interactive graph of biblical themes. Tap a node to read its verses."></svg>

<button id="reset-view" hidden></button>

<div id="hint"></div>


<aside id="panel" aria-live="polite">
  <button id="panel-close" aria-label="Close" title="Close">&times;</button>
  <div id="panel-content"></div>
</aside>

<footer id="footer">
  <p id="footer-text"></p>
  <p id="build"></p>
</footer>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
// Keeping installed copies current matters more than a fast first paint here:
// a stale copy silently serves old Scripture handling forever.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
      reg.update();
      setInterval(() => reg.update(), 60 * 60 * 1000);
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;            // reload once when a new build takes over
        reloading = true;
        location.reload();
      });
    } catch (e) { /* offline or unsupported: the page still works */ }
  });
}
</script>
</body>
</html>
